<div class="container mx-auto p-4 w-full">
  <!-- Section Title -->
  <h2 class="text-2xl font-bold mb-4 text-gray-800 dark:text-white">Announcements</h2>

  <!-- Create Button -->
  <button *ngIf="!createMode && canCreateAnnouncement()" (click)="createMode = true" 
    class="flex items-center text-white hover:bg-black font-medium px-4 py-2 rounded-md transition duration-300 mb-4 dark:bg-white dark:text-black" style="background-color: #0f172a;">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
    </svg>
    Post New Announcement
  </button>

  <!-- Create Form -->
  <div *ngIf="createMode" class="bg-white rounded-lg shadow-md p-5 mb-6 border border-gray-200">
    <h5 class="text-lg font-semibold text-gray-700 mb-4">Create New Announcement</h5>
    <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3" 
           placeholder="Title" [(ngModel)]="newAnnouncement.title">
    <textarea class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" 
              placeholder="Description" [(ngModel)]="newAnnouncement.description" rows="4"></textarea>

    <div *ngIf="isCompanyOrAdmin" class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Location ID</label>
      <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
             placeholder="Location ID" [(ngModel)]="newAnnouncement.location_id">
    </div>

    <div class="flex space-x-3">
      <button class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-md transition duration-300" 
              (click)="createAnnouncement()">Submit</button>
      <button class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-md transition duration-300" 
              (click)="createMode = false">Cancel</button>
    </div>
  </div>

  <!-- Announcements List -->
  <div *ngFor="let a of announcements; trackBy: trackByFn" class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 mb-4 hover:shadow-md transition duration-300">
    <div *ngIf="editId !== a.id">
      <h5 class="text-xl font-semibold text-gray-800 mb-2">{{ a.title }}</h5>
      <p class="text-gray-600 mb-3">{{ a.description }}</p>
      <div class="flex flex-wrap items-center text-sm text-gray-500 mb-3">
        <div class="flex items-center mr-6">
          <svg class="h-4 w-4 mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Created: {{ getRelativeFormat(a.created_at) }}
        </div>
        <div class="flex items-center" *ngIf="isCompanyOrAdmin">
          <svg class="h-4 w-4 mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Location: {{ a.location_id }}
        </div>
      </div>
      <div class="flex space-x-2">
        <button class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm transition duration-300 flex items-center" 
                (click)="editId = a.id; editAnnouncement = { title: a.title, description: a.description }">
          <svg class="h-4 w-4 mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
          </svg>
          Edit
        </button>
        <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition duration-300 flex items-center" 
                (click)="confirmDeleteAnnouncement(a.id)">
          <svg class="h-4 w-4 mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          Delete
        </button>
      </div>
    </div>

    <!-- Edit Mode -->
    <div *ngIf="editId === a.id" class="bg-gray-50 rounded-md p-4">
      <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3" 
             [(ngModel)]="editAnnouncement.title">
      <textarea class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" 
                [(ngModel)]="editAnnouncement.description" rows="3"></textarea>
      <div class="flex space-x-3">
        <button class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-md transition duration-300" 
                (click)="updateAnnouncement(a.id)">Save</button>
        <button class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-md transition duration-300" 
                (click)="editId = null">Cancel</button>
      </div>
    </div>
  </div>

  <!-- No Announcements Messages (as-is) -->
  <!-- ... your no data fallback + loading states remain unchanged ... -->

  <!-- DELETE CONFIRMATION MODAL -->
  <div *ngIf="showConfirmDialog" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 shadow-lg w-full max-w-md text-center">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Delete Announcement</h2>
      <p class="text-gray-600 mb-6">Are you sure you want to delete this announcement?</p>
      <div class="flex justify-center gap-4">
        <button (click)="proceedDelete()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition">Yes, Delete</button>
        <button (click)="cancelDelete()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition">Cancel</button>
      </div>
    </div>
  </div>
</div>
