<ng-container *ngIf="appearance === 'bar'">
    <button
        mat-icon-button
        *ngIf="!opened"
        (click)="open()">
        <mat-icon [svgIcon]="'heroicons_outline:search'"></mat-icon>
    </button>
    <div
        class="absolute inset-0 flex items-center flex-shrink-0 z-99 bg-card"
        *ngIf="opened"
        @slideInTop
        @slideOutTop>
        <mat-icon
            class="absolute ml-6 sm:ml-8"
            [svgIcon]="'heroicons_outline:search'"></mat-icon>
        <input
            class="w-full h-full px-16 sm:px-18"
            [formControl]="searchControl"
            [matAutocomplete]="matAutocomplete"
            [placeholder]="'Search for a page or a contact'"
            (keydown)="onKeydown($event)"
            #barSearchInput>
        <mat-autocomplete
            class="max-h-128 sm:px-2 border-t rounded-b shadow-md"
            [disableRipple]="true"
            #matAutocomplete="matAutocomplete">

            <!-- Only show "No results found" if user has typed something and searched -->
            <mat-option
                class="py-0 px-6 text-md pointer-events-none text-secondary bg-transparent"
                *ngIf="searchControl.value && searchControl.value.length >= minLength && !leadsResults.length && !mlsResults.length">
                No results found!
            </mat-option>

            <!-- LEADS GROUP -->
            <ng-container *ngIf="leadsResults.length">
                <mat-option class="py-0 px-6 text-xs font-bold text-gray-600 bg-transparent pointer-events-none" disabled>
                    LEADS ({{ leadsResults.length }})
                </mat-option>
                <div style="max-height: 220px; overflow-y: auto;">
                    <ng-container *ngFor="let result of leadsResults; trackBy: trackByFn">
                        <mat-option
                            class="group relative mb-1 py-0 px-6 text-md rounded-md hover:bg-gray-100 dark:hover:bg-hover"
                            (click)="onResultClick(result)">
                            <div>
                                <div class="font-semibold text-gray-900 dark:text-white" [innerHTML]="result.name || result.title || result.objectID"></div>
                                <div class="text-xs text-secondary" *ngIf="result.email">{{ result.email }}</div>
                                <div class="text-xs text-primary underline" *ngIf="result.link || result.url">
                                    {{ result.link || result.url }}
                                </div>
                            </div>
                        </mat-option>
                    </ng-container>
                </div>
            </ng-container>

            <!-- MLS GROUP -->
            <ng-container *ngIf="mlsResults.length">
                <mat-option class="py-0 px-6 text-xs font-bold text-blue-600 bg-transparent pointer-events-none" disabled>
                    MLS RESULTS ({{ mlsResults.length }})
                </mat-option>
                <div style="max-height: 220px; overflow-y: auto;">
                    <ng-container *ngFor="let result of mlsResults; trackBy: trackByFn">
                        <mat-option
                            class="group relative mb-1 py-0 px-6 text-md rounded-md hover:bg-gray-100 dark:hover:bg-hover"
                            (click)="onResultClick(result)">
                            <div>
                                <div class="font-semibold text-gray-900 dark:text-white">{{ result.address || result.title || result.objectID }}</div>
                            </div>
                        </mat-option>
                    </ng-container>
                </div>
            </ng-container>
        </mat-autocomplete>
        <button
            class="absolute top-1/2 right-5 sm:right-7 flex-shrink-0 w-10 h-10 -mt-5"
            mat-icon-button
            (click)="close()">
            <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
        </button>
    </div>
</ng-container>

<!-- Basic search -->
<ng-container *ngIf="appearance === 'basic'">
    <div class="w-full sm:min-w-80">
        <mat-form-field class="fuse-mat-no-subscript w-full">
            <mat-icon
                matPrefix
                [svgIcon]="'heroicons_outline:search'"></mat-icon>
            <input
                matInput
                [formControl]="searchControl"
                [matAutocomplete]="matAutocomplete"
                [placeholder]="'Search for a page or a contact'"
                (keydown)="onKeydown($event)">
        </mat-form-field>
        <mat-autocomplete
            class="max-h-128 mt-1 rounded"
            [disableRipple]="true"
            #matAutocomplete="matAutocomplete">
            <mat-option
                class="py-0 px-6 text-md pointer-events-none text-secondary bg-transparent"
                *ngIf="searchControl.value && searchControl.value.length >= minLength && resultSets && !resultSets.length">
                No results found!
            </mat-option>
            <!-- Algolia results -->
            <ng-container *ngFor="let result of resultSets | slice:0:8; trackBy: trackByFn">
                <mat-option
                    class="group relative mb-1 py-0 px-6 text-md rounded-md hover:bg-gray-100 dark:hover:bg-hover"
                    (click)="onResultClick(result)">
                    <div>
                        <div class="font-semibold" [innerHTML]="result.name || result.title || result.objectID"></div>
                        <div class="text-xs text-secondary" *ngIf="result.email">{{ result.email }}</div>
                        <div class="text-xs text-primary underline" *ngIf="result.link || result.url">
                            {{ result.link || result.url }}
                        </div>
                    </div>
                </mat-option>
            </ng-container>
        </mat-autocomplete>
    </div>
</ng-container>
